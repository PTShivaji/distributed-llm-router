# Continuous integration for the Distributed LLM Router.
#
# Safety model (see README "Continuous integration"):
#   * Mock providers only: LLM_MOCK_MODE=true, ALLOW_REAL_PROVIDER_CALLS=false, and no
#     provider API key or other repository secret is referenced anywhere in this file.
#   * PostgreSQL: an ephemeral service whose only application database is llm_router_test.
#     The test suite's connection guard refuses llm_router, postgres, template0, template1.
#   * Redis: an ephemeral service; the test suite's guard refuses every logical DB except 15.
#   * No deployment, no pushes, read-only token. Environment values are never printed.
#   * Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  # ------------------------------------------------------------------------- #
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No secret files are tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.env$|(^|/)(id_rsa|id_ed25519)|\.(pem|key|crt|p12|ppk|age|gpg|dump)$|(^|/)(secrets|backups)/|(^|/)age-key[^/]*\.txt$' \
                | grep -vE '(^|/)\.env\.example$|(^|/)\.env\.production\.example$|\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Secret-like files are tracked (remove them from the index and rotate any exposed values):"
            echo "$bad"
            exit 1
          fi
          echo "No secret-like files tracked."

      - name: .gitignore still protects secret files
        run: |
          set -euo pipefail
          for p in .env .env.local .env.production .env.backup-before-redis-fix backend/.env frontend/.env \
                   id_rsa id_rsa.pub id_ed25519 key.ppk server.pem server.key secrets/x backups/x db.dump; do
            if ! git check-ignore -q --no-index "$p"; then
              echo "::error::$p is not ignored by .gitignore"; exit 1
            fi
          done
          echo "All protected paths are ignored."

      - name: No generated, virtualenv, cache or log files are tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)(venv|\.venv|node_modules|dist|coverage|htmlcov|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache)/|\.py[cod]$|\.log$|^backend/benchmarks/results/' || true)
          if [ -n "$bad" ]; then echo "::error::Generated files are tracked:"; echo "$bad"; exit 1; fi
          echo "No generated files tracked."

      - name: No CRLF line endings in the repository
        run: |
          set -euo pipefail
          bad=$(git ls-files --eol | awk '$1 == "i/crlf" || $1 == "i/mixed" {print $NF}')
          if [ -n "$bad" ]; then echo "::error::Files stored with CRLF (see .gitattributes):"; echo "$bad"; exit 1; fi
          echo "All text files are stored with LF."

      - name: No credential-shaped strings outside test fixtures
        run: |
          set -euo pipefail
          # Tests deliberately contain FAKE keys (redaction tests); they are excluded here and the
          # production bundle is scanned separately by `npm run check:bundle`.
          pattern='sk-(proj-|ant-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|xox[bap]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{30,}|gsk_[A-Za-z0-9]{20,}'
          files=$(git ls-files | grep -vE '^backend/tests/|\.test\.tsx?$|^frontend/src/test/' || true)
          hits=$(echo "$files" | xargs -d '\n' grep -lE "$pattern" -- 2>/dev/null || true)
          if [ -n "$hits" ]; then echo "::error::Credential-shaped strings found (values not shown) in:"; echo "$hits"; exit 1; fi
          echo "No credential-shaped strings found."

  # ------------------------------------------------------------------------- #
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Public development defaults (also in docker-compose.yml / app config) for a
          # throwaway CI container: not secrets. llm_router_test is the ONLY application
          # database; llm_router is never created here.
          POSTGRES_USER: router
          POSTGRES_PASSWORD: router_password
          POSTGRES_DB: llm_router_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U router -d llm_router_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -n 15 ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Belt and braces: mock providers only, real calls refused. The suite also forces
      # mock mode per test and never reads a .env file (LLMR_DISABLE_ENV_FILE in conftest).
      LLM_MOCK_MODE: "true"
      ALLOW_REAL_PROVIDER_CALLS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: No provider credentials in the job environment
        run: |
          set -euo pipefail
          # Names only; values are never printed.
          names=$(env | cut -d= -f1 | grep -E '_API_KEY$|_API_KEYS$|^(OPENAI|ANTHROPIC|GEMINI|GROQ|MISTRAL)_' || true)
          if [ -n "$names" ]; then echo "::error::Provider credential variables are set: $names"; exit 1; fi
          echo "No provider credential variables present."

      - name: Isolation guards self-test (PostgreSQL + Redis DB15)
        working-directory: backend
        run: python -m pytest -q tests/test_test_db_isolation.py tests/test_benchmark_db_isolation.py tests/test_redis_db_guard.py

      - name: Full backend suite
        working-directory: backend
        run: python -m pytest -ra --junitxml=../test-results/backend-junit.xml -o junit_family=xunit2

      - name: Zero-skip gate (backend)
        if: ${{ !cancelled() }}
        run: |
          python - test-results/backend-junit.xml "Backend" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          path, label = sys.argv[1], sys.argv[2]
          if not os.path.exists(path):
              print(f"::error::{label}: JUnit report {path} is missing"); sys.exit(1)
          cases = list(ET.parse(path).iter("testcase"))
          name = lambda c: f"{c.get('classname', '')}::{c.get('name', '')}"
          skipped = [c for c in cases if c.find("skipped") is not None]
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          lines = [f"### {label} tests", "", "| total | passed | failed/errors | skipped |", "|---|---|---|---|",
                   f"| {len(cases)} | {len(cases) - len(skipped) - len(failed)} | {len(failed)} | {len(skipped)} |", ""]
          lines += [f"- FAILED `{name(c)}`" for c in failed] + [f"- SKIPPED `{name(c)}`" for c in skipped]
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          for c in skipped:
              reason = (c.find("skipped").get("message") or "").splitlines()[0][:200] if c.find("skipped").get("message") else ""
              print(f"::error title=Skipped test::{label}: {name(c)} {reason}")
          print("\n".join(lines))
          if not cases:
              print(f"::error::{label}: no tests were collected"); sys.exit(1)
          if skipped:
              print(f"::error::{label}: {len(skipped)} test(s) skipped; required services or dependencies are missing"); sys.exit(1)
          sys.exit(1 if failed else 0)
          PY

      - name: Upload backend JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-junit
          path: test-results/backend-junit.xml
          retention-days: 14
          if-no-files-found: warn

  # ------------------------------------------------------------------------- #
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../test-results/frontend-junit.xml

      - name: Zero-skip gate (frontend)
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          python3 - test-results/frontend-junit.xml "Frontend" <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          path, label = sys.argv[1], sys.argv[2]
          if not os.path.exists(path):
              print(f"::error::{label}: JUnit report {path} is missing"); sys.exit(1)
          cases = list(ET.parse(path).iter("testcase"))
          name = lambda c: f"{c.get('classname', '')}::{c.get('name', '')}"
          skipped = [c for c in cases if c.find("skipped") is not None]
          failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
          lines = [f"### {label} tests", "", "| total | passed | failed/errors | skipped |", "|---|---|---|---|",
                   f"| {len(cases)} | {len(cases) - len(skipped) - len(failed)} | {len(failed)} | {len(skipped)} |", ""]
          lines += [f"- FAILED `{name(c)}`" for c in failed] + [f"- SKIPPED `{name(c)}`" for c in skipped]
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
                  f.write("\n".join(lines) + "\n")
          for c in skipped:
              print(f"::error title=Skipped test::{label}: {name(c)}")
          print("\n".join(lines))
          if not cases:
              print(f"::error::{label}: no tests were collected"); sys.exit(1)
          if skipped:
              print(f"::error::{label}: {len(skipped)} test(s) skipped"); sys.exit(1)
          sys.exit(1 if failed else 0)
          PY

      - name: Upload frontend JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-junit
          path: test-results/frontend-junit.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Production build
        run: npm run build

      - name: Bundle secret scan
        run: npm run check:bundle

  # ------------------------------------------------------------------------- #
  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --ignore-scripts --prefix frontend

      - name: Regenerate the schema OUTSIDE the checkout and compare
        env:
          LLM_MOCK_MODE: "true"
          ALLOW_REAL_PROVIDER_CALLS: "false"
        run: |
          set -euo pipefail
          # The export script writes next to itself; run a copy under $RUNNER_TEMP so the
          # committed generated files are never modified. It opens no connections.
          gen="$RUNNER_TEMP/openapi/frontend"
          mkdir -p "$gen/scripts"
          cp frontend/scripts/export_openapi.py "$gen/scripts/"
          PYTHONPATH="$GITHUB_WORKSPACE/backend" python "$gen/scripts/export_openapi.py"
          (cd frontend && npx --no-install openapi-typescript "$gen/src/api/openapi.json" -o "$gen/schema.gen.ts")
          status=0
          diff -u frontend/src/api/openapi.json "$gen/src/api/openapi.json" > /dev/null || { echo "::error::frontend/src/api/openapi.json is out of date: run 'npm run gen:api' in frontend/"; status=1; }
          diff -u frontend/src/api/schema.gen.ts "$gen/schema.gen.ts" > /dev/null || { echo "::error::frontend/src/api/schema.gen.ts is out of date: run 'npm run gen:api' in frontend/"; status=1; }
          [ "$status" -eq 0 ] && echo "Generated API files match the backend."
          exit "$status"

  # ------------------------------------------------------------------------- #
  dependency-audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: pip-audit (blocks on ANY known vulnerability)
        run: |
          # pip-audit reports no severity, so it cannot filter to high/critical: every known
          # vulnerability fails the job. Accept a reviewed finding only with an explicit
          # --ignore-vuln <ID> here plus a comment explaining why (none today).
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-observability.txt -r requirements-dev.txt \
            --no-deps --disable-pip --progress-spinner off

      - name: npm audit (report all, block high/critical)
        working-directory: frontend
        run: |
          echo "Full report (informational, includes moderate/low):"
          npm audit || true
          echo
          echo "Gate: high/critical in any dependency fails the job."
          npm audit --audit-level=high
