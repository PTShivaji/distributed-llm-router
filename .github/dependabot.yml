# Dependabot only opens pull requests; it never merges, deploys or reads repository secrets.
# Every update PR runs the full CI workflow (tests, audits, zero-skip gate) before review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"          # requirements.txt, requirements-dev.txt, requirements-observability.txt
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "huggingface-hub"
        versions: [">=2.0.0"]
      - dependency-name: "importlib-metadata"
        versions: [">=9.0.0"]
      - dependency-name: "python-dateutil"
        versions: [">=3.0.0"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
